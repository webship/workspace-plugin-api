name: ci

on:
  push:
    branches: ['1.0.x']
  pull_request:
    branches: ['1.0.x']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 22: the lowest Node.js line the Workspace accepts (22.18), the first that runs the TypeScript tests as they are.
        # 26: the Node.js the Workspace builds on.
        node: ['22', '26']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: every shell script parses
        run: |
          git ls-files -z '*.sh' | xargs -0 -r -n1 bash -n
          echo "$(git ls-files '*.sh' | wc -l) shell script(s) parse"
